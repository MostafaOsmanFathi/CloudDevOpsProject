name: CI - auth-service

on:
  push:
    branches:
      - main
    paths:
      - "src/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "src/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan and push the auth-service image
    # The reusable workflow's update-manifests job needs contents: write.
    # Called workflows may only keep or reduce the caller's permissions, so
    # the caller has to grant it explicitly (repo default is read-only).
    permissions:
      contents: write
    uses: ./.github/workflows/ci-image.yml
    with:
      service: auth-service
      context: src/auth-service
      image: auth-service
      namespace: mostafaosmanfathi
      push: ${{ github.event_name != 'pull_request' }}
      update-manifests: ${{ github.event_name == 'push' }}
    secrets: inherit
