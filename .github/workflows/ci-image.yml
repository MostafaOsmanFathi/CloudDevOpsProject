name: Reusable - build, scan and push an image

on:
  workflow_call:
    inputs:
      service:
        description: Name of the microservice, also the name of the container and of the deployment.
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      dockerfile:
        description: Dockerfile, relative to the build context.
        required: false
        type: string
        default: Dockerfile
      image:
        description: Docker Hub repository name, without the namespace prefix.
        required: true
        type: string
      namespace:
        description: Docker Hub namespace (account) that owns the repository.
        required: false
        type: string
        default: mostafaosmanfathi
      push:
        description: Push the image to Docker Hub.
        required: false
        type: boolean
        default: true
      update-manifests:
        description: Update the Kubernetes manifests and push them to the repository.
        required: false
        type: boolean
        default: true
      scan-severity:
        description: Severities that make the scan fail.
        required: false
        type: string
        default: CRITICAL,HIGH
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username.
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token (not the account password).
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The immutable tag below is the one the scan job pulls, so it must match
      # the sha tag produced by docker/metadata-action (prefix "sha-", full SHA).
      - name: Compute the image reference
        id: reference
        run: |
          echo "image=${{ inputs.namespace }}/${{ inputs.image }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.namespace }}/${{ inputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.push }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          # push and load are mutually exclusive, exactly one of them is used.
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  scan:
    name: Scan the image with Trivy
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Needed when the image is not pushed: the rebuild below uses src/<service>.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image that was pushed
        if: ${{ inputs.push }}
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Rebuild the image locally
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ needs.build.outputs.image }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: table
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: "1"

  update-manifests:
    name: Update the Kubernetes manifests
    needs: [build, scan]
    if: ${{ inputs.push && inputs.update-manifests }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Point the deployment at the new image
        run: |
          manifest="kubernetes/${{ inputs.service }}/deployment.yaml"
          kubectl set image --local -f "$manifest" \
            "${{ inputs.service }}=${{ needs.build.outputs.image }}" \
            -o yaml > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Commit and push the manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "kubernetes/${{ inputs.service }}/deployment.yaml"
          if git diff --cached --quiet; then
            echo "The manifests are already up to date."
            exit 0
          fi
          git commit -m "chore(k8s): update the ${{ inputs.service }} image to ${{ needs.build.outputs.image }}"
          git push
