name: CI - frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan and push the frontend image
    uses: ./.github/workflows/ci-image.yml
    with:
      service: frontend
      context: src/frontend
      image: ivolve-frontend
      push: ${{ github.event_name != 'pull_request' }}
      update-manifests: ${{ github.event_name == 'push' }}
    secrets: inherit
