name: Build, scan and push images

on:
  push:
    branches: [main]
    # Only a change that can alter an image or a deployed manifest needs a
    # build; docs and terraform commits should not rebuild three images.
    paths:
      - "src/**"
      - "kubernetes/**"
      - "docker-compose.yml"
      - ".github/workflows/image-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, auth-service, roadmap-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image
        run: |
          docker build \
            -t mostafaosmanfathi/${{ matrix.service }}:latest \
            -t mostafaosmanfathi/${{ matrix.service }}:sha-${{ github.sha }} \
            src/${{ matrix.service }}

      # Scan the local image before pushing: a vulnerable image never reaches
      # the registry. Trivy caches its vulnerability DB automatically.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mostafaosmanfathi/${{ matrix.service }}:latest
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: table
          # Report the findings without blocking the push. Change to '1' once
          # the base images/dependencies are updated, to make the scan a gate.
          exit-code: '0'

      - name: Push the image
        if: github.event_name != 'pull_request'
        run: |
          docker push mostafaosmanfathi/${{ matrix.service }}:latest
          docker push mostafaosmanfathi/${{ matrix.service }}:sha-${{ github.sha }}

  # Argo CD syncs what is in Git, so the image tag has to be written back to the
  # repository: that commit is what Argo CD detects and rolls out. Without this
  # job the Deployments would stay on `latest` forever and nothing would deploy.
  gitops:
    name: Pin the deployed image tags
    needs: image
    # Only for a push to main. A pull request must not change the deploy files,
    # and the commit below carries [skip ci], so the loop stops after one run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin the tags to this commit
        run: |
          sed -i "s|^\( *newTag: \)sha-.*|\1sha-${GITHUB_SHA}|" kubernetes/kustomization.yaml
          git --no-pager diff -- kubernetes/kustomization.yaml

      - name: Commit and push
        run: |
          if git diff --quiet -- kubernetes/kustomization.yaml; then
            echo "image tags already point at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/kustomization.yaml
          git commit -m "chore(gitops): pin images to sha-${GITHUB_SHA} [skip ci]"
          git push origin main
