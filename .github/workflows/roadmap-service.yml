name: CI - roadmap-service

on:
  push:
    branches:
      - main
    paths:
      - "src/roadmap-service/**"
      - ".github/workflows/roadmap-service.yml"
      - ".github/workflows/ci-image.yml"
  pull_request:
    paths:
      - "src/roadmap-service/**"
      - ".github/workflows/roadmap-service.yml"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

concurrency:
  group: roadmap-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan and push the roadmap-service image
    uses: ./.github/workflows/ci-image.yml
    with:
      service: roadmap-service
      context: src/roadmap-service
      image: ivolve-roadmap-service
      push: ${{ github.event_name != 'pull_request' }}
      update-manifests: ${{ github.event_name == 'push' }}
    secrets: inherit
