name: CI - validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: aws
          - provider: azure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Check the formatting
        run: terraform fmt -recursive -check -diff
        working-directory: terraform/${{ matrix.provider }}

      - name: Validate the configuration
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: terraform/${{ matrix.provider }}

      - name: Run the plan test
        run: terraform test
        working-directory: terraform/${{ matrix.provider }}

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint

      - name: Install the collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Lint the roles and the playbooks
        run: ansible-lint playbooks/ roles/
        working-directory: ansible

      - name: Check the playbook syntax
        run: ansible-playbook playbooks/site.yml --syntax-check -i inventory/localhost.yml
        working-directory: ansible

  kubernetes:
    name: Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the manifests
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -skip Kustomization kubernetes/

      - name: Build the kustomization
        run: kubectl kustomize kubernetes/ > /dev/null

  images:
    name: Build the images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: src/frontend
          - service: auth-service
            context: src/auth-service
          - service: roadmap-service
            context: src/roadmap-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image without pushing it
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose file
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 600

      - name: Check that the services answer
        run: |
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:8080/api/roadmap > /dev/null
          curl -fsS http://localhost:3000/ > /dev/null

      - name: Collect the logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
