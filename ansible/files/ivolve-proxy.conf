# Public entry points for the iVolve project, installed on the Jenkins VM.
#   /                     -> the application (frontend NodePort in AKS)
#   http://argocd.ivolve.local/ -> the Argo CD UI (Argo CD server NodePort)
# The VM has the only public IP available (the region allows 3 and they are
# all used), so both are served from 9.205.91.181 on port 80.
#
# Argo CD is served by name, not by path: Argo CD 3.x ignores server.basehref,
# so under /argocd/ the page loads but its assets resolve to "/".
# It is also published through a Cloudflare Tunnel on this VM, which gives a
# real https://<name>.trycloudflare.com URL with no hosts edit and no certificate.

# WebSocket upgrade mapping, needed by the Argo CD UI (live logs, web terminal).
map $http_upgrade $ivolve_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://10.0.10.4:30300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name argocd.ivolve.local;

    location / {
        proxy_pass http://10.0.10.4:30080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ivolve_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
