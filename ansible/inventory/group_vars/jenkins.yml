---
# Variables that only apply to the Jenkins instances.
#
# The Jenkins server also runs Docker and Trivy, because the CI pipelines
# build and scan the microservice images on it.

jenkins_plugins:
  - kubernetes
  - workflow-aggregator
  - git
  - credentials-binding
  - pipeline-stage-view
  - ws-cleanup

jenkins_docker_group: docker
jenkins_scan_schedule: daily
