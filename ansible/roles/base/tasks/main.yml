---
# Install the base packages and system settings.
- name: Install the base packages
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present
    update_cache: true

- name: Set the system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  notify: Restart chrony

- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: "{{ base_chrony_service }}"
    state: started
    enabled: true

- name: Ensure the SSH server is enabled and running
  ansible.builtin.service:
    name: "{{ base_ssh_service }}"
    state: started
    enabled: true
