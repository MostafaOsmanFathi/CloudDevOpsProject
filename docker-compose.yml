# =============================================================================
#  iVolve DevOps Project - Local Development Stack
# -----------------------------------------------------------------------------
#  Builds every microservice from its own Dockerfile and runs the whole
#  application together with a local MySQL database.
#
#  Services
#    frontend        Node.js / Express  -> http://localhost:3000
#    auth-service    Python  / Flask    -> http://localhost:5000  (talks to MySQL)
#    roadmap-service Java   / SpringBoot-> http://localhost:8080
#    mysql           MySQL 8            -> localhost:3306  (database "ivolve")
#
#  Usage
#    docker compose up --build -d      # build images and start the stack
#    docker compose ps                 # check the health of every container
#    docker compose logs -f frontend   # follow one service log
#    docker compose down -v            # stop and delete the database volume
#
#  Every value can be overridden with an environment variable or with a local
#  ".env" file (see .env.example).
# =============================================================================

name: ivolve-devops

services:
  # ---------------------------------------------------------------------------
  # Database - MySQL 8 (only the auth service talks to the database)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: ivolve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ivolve}
      MYSQL_USER: ${MYSQL_USER:-ibrahim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass@123}
    ports:
      # Host -> container. Useful to connect with a local MySQL client.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Named volume so the "users" table survives `docker compose down`.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The auth service only starts once MySQL really accepts connections.
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net

  # ---------------------------------------------------------------------------
  # Auth Service - Python / Flask (registration + login, bcrypt hashed)
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ./src/auth-service
      dockerfile: Dockerfile
    image: ivolve/auth-service:latest
    container_name: ivolve-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ivolve}
      DB_USER: ${MYSQL_USER:-ibrahim}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pass@123}
    ports:
      - "${AUTH_SERVICE_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # /health verifies the database connection and creates the "users" table.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ivolve-net

  # ---------------------------------------------------------------------------
  # Roadmap Service - Java / Spring Boot (DevOps roadmap data)
  # ---------------------------------------------------------------------------
  roadmap-service:
    build:
      context: ./src/roadmap-service
      dockerfile: Dockerfile
    image: ivolve/roadmap-service:latest
    container_name: ivolve-roadmap-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
    ports:
      - "${ROADMAP_SERVICE_PORT:-8080}:8080"
    healthcheck:
      # The JRE image has no curl/wget, so the port is probed with bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net

  # ---------------------------------------------------------------------------
  # Frontend Service - Node.js / Express (EJS views, session based login)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: ivolve/frontend:latest
    container_name: ivolve-frontend
    restart: unless-stopped
    environment:
      # Service names are resolved by the compose network.
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-k8s}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      roadmap-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ivolve-net

# -----------------------------------------------------------------------------
# Named volumes
# -----------------------------------------------------------------------------
volumes:
  mysql-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  ivolve-net:
    driver: bridge
