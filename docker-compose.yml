name: ivolve-devops

services:
  mysql:
    image: mysql:8.4
    container_name: ivolve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ivolve}
      MYSQL_USER: ${MYSQL_USER:-ibrahim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass@123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net

  auth-service:
    build:
      context: ./src/auth-service
      dockerfile: Dockerfile
    image: ivolve/auth-service:latest
    container_name: ivolve-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ivolve}
      DB_USER: ${MYSQL_USER:-ibrahim}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pass@123}
    ports:
      - "${AUTH_SERVICE_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ivolve-net

  roadmap-service:
    build:
      context: ./src/roadmap-service
      dockerfile: Dockerfile
    image: ivolve/roadmap-service:latest
    container_name: ivolve-roadmap-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
    ports:
      - "${ROADMAP_SERVICE_PORT:-8080}:8080"
    healthcheck:
      # The JRE image has no curl/wget, so the port is probed with bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: ivolve/frontend:latest
    container_name: ivolve-frontend
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-k8s}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      roadmap-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ivolve-net

volumes:
  mysql-data:
    driver: local

networks:
  ivolve-net:
    driver: bridge
