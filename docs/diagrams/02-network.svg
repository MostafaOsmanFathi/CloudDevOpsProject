<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker></defs><text x="40" y="44" font-family="DejaVu Sans" font-size="24" fill="#1B2733" font-weight="bold" text-anchor="start">Network topology - Azure VNet with the AWS equivalent</text>
<text x="40" y="72" font-family="DejaVu Sans" font-size="14" fill="#5A6B7B" font-weight="normal" text-anchor="start">Denmark East - the VM lives in a public subnet, the Kubernetes nodes in private subnets, all egress goes through one NAT gateway.</text>
<rect x="40" y="100" width="940" height="640" rx="16" fill="#FBFDFF" stroke="#0078D4" stroke-width="2.5"/>
<text x="70" y="140" font-family="DejaVu Sans" font-size="17" fill="#004E8C" font-weight="bold" text-anchor="start">Virtual Network  (AWS VPC)   10.0.0.0/16</text>
<rect x="70" y="170" width="400" height="220" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="90" y="202" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="start">public-subnet-1   10.0.0.0/24</text>
<rect x="90" y="222" width="150" height="46" rx="7" fill="#0078D4" stroke="#0078D4" stroke-width="0"/><text x="165.0" y="243.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Jenkins NIC</text>
<text x="165.0" y="259.0" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" font-weight="normal" text-anchor="middle">10.0.0.4</text>
<rect x="255" y="222" width="190" height="46" rx="7" fill="#7B4F00" stroke="#7B4F00" stroke-width="0"/><text x="350.0" y="243.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">public IP</text>
<text x="350.0" y="259.0" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" font-weight="normal" text-anchor="middle">9.205.91.181</text>
<text x="90" y="300" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="bold" text-anchor="start">NSG rules (AWS Security Group)</text>
<text x="90" y="315" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">22 TCP from admin CIDR</text>
<text x="90" y="329" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">8080 TCP from admin CIDR</text>
<text x="90" y="343" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">80 / 443 TCP from anywhere</text>
<text x="90" y="357" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">egress * allowed</text>
<rect x="510" y="170" width="400" height="220" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="530" y="202" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="start">public-subnet-2   10.0.1.0/24</text>
<text x="530" y="240" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">spare - second availability zone</text>
<text x="530" y="255" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">no workload placed here yet</text>
<rect x="70" y="420" width="400" height="290" rx="12" fill="#EAF1F9" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="90" y="452" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="start">private-subnet-1   10.0.10.0/24</text>
<rect x="90" y="472" width="250" height="46" rx="7" fill="#004E8C" stroke="#004E8C" stroke-width="0"/><text x="215.0" y="499.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">AKS system node  10.0.10.4</text>
<text x="90" y="552" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="bold" text-anchor="start">NSG rules</text>
<text x="90" y="567" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">22 TCP from admin CIDR</text>
<text x="90" y="581" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">VNet inbound allowed</text>
<text x="90" y="595" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">egress * allowed</text>
<text x="90" y="640" font-family="DejaVu Sans" font-size="10" fill="#107C10" font-weight="normal" text-anchor="start">NAT gateway associated - this is</text>
<text x="90" y="654" font-family="DejaVu Sans" font-size="10" fill="#107C10" font-weight="normal" text-anchor="start">how the node reaches the internet</text>
<rect x="510" y="420" width="400" height="290" rx="12" fill="#EAF1F9" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="530" y="452" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="start">private-subnet-2   10.0.11.0/24</text>
<text x="530" y="486" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">AKS user2 pool (0 nodes)</text>
<text x="530" y="501" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">NAT gateway associated</text>
<rect x="1010" y="170" width="250" height="130" rx="12" fill="#F4F7FB" stroke="#7B4F00" stroke-width="2"/>
<text x="1030" y="204" font-family="DejaVu Sans" font-size="15" fill="#7B4F00" font-weight="bold" text-anchor="start">NAT Gateway</text>
<text x="1030" y="230" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">AWS: NAT Gateway</text>
<text x="1030" y="245" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">public IP 9.205.92.29</text>
<text x="1030" y="260" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">regional SKU, static IP</text>
<rect x="1010" y="320" width="250" height="60" rx="7" fill="#444444" stroke="#444444" stroke-width="0"/><text x="1135.0" y="354.0" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Internet</text>
<rect x="1010" y="420" width="250" height="150" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="1030" y="454" font-family="DejaVu Sans" font-size="15" fill="#004E8C" font-weight="bold" text-anchor="start">AKS control plane</text>
<text x="1030" y="478" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="bold" text-anchor="start">API server FQDN</text>
<text x="1030" y="492" font-family="DejaVu Sans" font-size="9" fill="#5A6B7B" font-weight="normal" text-anchor="start">ivolve-aks-ybyvjbfv.hcp.</text>
<text x="1030" y="504" font-family="DejaVu Sans" font-size="9" fill="#5A6B7B" font-weight="normal" text-anchor="start">denmarkeast.azmk8s.io</text>
<text x="1030" y="516" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">public, locked to admin CIDR</text>
<polyline points="290,560 290,725 980,725 980,270 1010,270" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1135" y1="300" x2="1135" y2="320" stroke="#7B4F00" stroke-width="2" marker-end="url(#arr)"/>
<text x="600" y="715" font-family="DejaVu Sans" font-size="11" fill="#107C10" font-weight="bold" text-anchor="middle">egress: node -&gt; NAT gateway -&gt; internet</text>
<text x="1245" y="250" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="bold" text-anchor="end">NAT</text></svg>