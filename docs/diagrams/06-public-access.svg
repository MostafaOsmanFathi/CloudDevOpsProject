<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker></defs><text x="40" y="46" font-family="DejaVu Sans" font-size="24" fill="#1B2733" font-weight="bold" text-anchor="start">How the application is exposed to the network</text>
<text x="40" y="74" font-family="DejaVu Sans" font-size="14" fill="#5A6B7B" font-weight="normal" text-anchor="start">The subscription has only 3 public IPs, so the public address of the Jenkins VM is reused as the entry point. AWS names in brackets.</text>
<rect x="40" y="120" width="200" height="100" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="140" y="158" font-family="DejaVu Sans" font-size="15" fill="#1B2733" font-weight="bold" text-anchor="middle">User / browser</text>
<text x="140" y="182" font-family="DejaVu Sans" font-size="11" fill="#004E8C" font-weight="bold" text-anchor="middle">http://9.205.91.181/</text>
<rect x="300" y="120" width="230" height="100" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="415" y="152" font-family="DejaVu Sans" font-size="15" fill="#1B2733" font-weight="bold" text-anchor="middle">Azure Public IP</text>
<text x="415" y="174" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="middle">(AWS Elastic IP)</text>
<text x="415" y="196" font-family="DejaVu Sans" font-size="11" fill="#E8A33D" font-weight="bold" text-anchor="middle">9.205.91.181 - 1 of 3</text>
<rect x="590" y="110" width="250" height="120" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="715" y="142" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="middle">NSG  (AWS Security Group)</text>
<text x="715" y="168" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="middle">JenkinsHttp  :80  from 0.0.0.0/0</text>
<text x="715" y="182" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="middle">JenkinsSsh   :22  from 0.0.0.0/0</text>
<text x="715" y="196" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="middle">JenkinsUi    :8080</text>
<rect x="900" y="100" width="400" height="160" rx="12" fill="#F4F7FB" stroke="#0078D4" stroke-width="2"/>
<text x="920" y="134" font-family="DejaVu Sans" font-size="15" fill="#004E8C" font-weight="bold" text-anchor="start">Jenkins VM  (AWS EC2)</text>
<text x="920" y="160" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">10.0.0.4 - public-subnet-1</text>
<text x="920" y="175" font-family="DejaVu Sans" font-size="12" fill="#107C10" font-weight="bold" text-anchor="start">nginx reverse proxy on port 80</text>
<text x="920" y="191" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">proxy_pass http://10.0.10.4:30300</text>
<text x="920" y="206" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">installed with: az vm run-command invoke</text>
<line x1="240" y1="170" x2="300" y2="170" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="530" y1="170" x2="590" y2="170" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arr)"/>
<line x1="840" y1="180" x2="900" y2="180" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="330" width="1260" height="430" rx="16" fill="#FBFDFF" stroke="#0078D4" stroke-width="2.5"/>
<text x="64" y="368" font-family="DejaVu Sans" font-size="17" fill="#004E8C" font-weight="bold" text-anchor="start">Virtual Network  (AWS VPC)   10.0.0.0/16</text>
<rect x="64" y="410" width="250" height="80" rx="10" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="189" y="442" font-family="DejaVu Sans" font-size="13" fill="#1B2733" font-weight="bold" text-anchor="middle">public-subnet-1</text>
<text x="189" y="464" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="middle">10.0.0.0/24</text>
<text x="189" y="480" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="middle">Jenkins NIC 10.0.0.4</text>
<rect x="340" y="410" width="940" height="320" rx="12" fill="#EAF1F9" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="364" y="442" font-family="DejaVu Sans" font-size="14" fill="#1B2733" font-weight="bold" text-anchor="start">private-subnet-1   10.0.10.0/24</text>
<rect x="364" y="470" width="240" height="70" rx="7" fill="#004E8C" stroke="#004E8C" stroke-width="0"/><text x="484.0" y="503.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">AKS node  10.0.10.4</text>
<text x="484.0" y="519.0" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Standard_DS3_v2 - 4 vCPU</text>
<line x1="604" y1="505" x2="648" y2="505" stroke="#107C10" stroke-width="2" marker-end="url(#arr)"/>
<rect x="648" y="470" width="270" height="70" rx="7" fill="#107C10" stroke="#107C10" stroke-width="0"/><text x="783.0" y="503.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">frontend-nodeport</text>
<text x="783.0" y="519.0" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" font-weight="normal" text-anchor="middle">NodePort 30300 -&gt; 3000</text>
<line x1="918" y1="505" x2="962" y2="505" stroke="#107C10" stroke-width="2" marker-end="url(#arr)"/>
<rect x="962" y="470" width="296" height="70" rx="7" fill="#0078D4" stroke="#0078D4" stroke-width="0"/><text x="1110.0" y="503.0" font-family="DejaVu Sans" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">frontend pods x2</text>
<text x="1110.0" y="519.0" font-family="DejaVu Sans" font-size="10" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Express on 3000</text>
<polyline points="1110,540 1110,580" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arr)"/>
<rect x="364" y="580" width="900" height="130" rx="10" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="384" y="612" font-family="DejaVu Sans" font-size="13" fill="#004E8C" font-weight="bold" text-anchor="start">ClusterIP Services - in-cluster only</text>
<text x="384" y="640" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">auth-service.ivolve.svc.cluster.local:5000</text>
<text x="384" y="655" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">roadmap-service.ivolve.svc.cluster.local:8080</text>
<text x="384" y="670" font-family="DejaVu Sans" font-size="11" fill="#1B2733" font-weight="normal" text-anchor="start">mysql.ivolve.svc.cluster.local:3306  (headless)</text>
<text x="384" y="685" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">The frontend calls these server-side, so the browser only ever talks to port 80.</text>
<polyline points="1100,260 1100,300 790,300 790,470" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arr)"/>
<text x="950" y="292" font-family="DejaVu Sans" font-size="11" fill="#107C10" font-weight="bold" text-anchor="start">HTTP reverse proxy</text>
<text x="640" y="396" font-family="DejaVu Sans" font-size="10" fill="#5A6B7B" font-weight="normal" text-anchor="start">the VM reaches the node through the VNet - the pod uses an Azure CNI address</text>
<rect x="40" y="790" width="400" height="150" rx="12" fill="#FDECEA" stroke="#D13438" stroke-width="2"/>
<text x="60" y="822" font-family="DejaVu Sans" font-size="13" fill="#D13438" font-weight="bold" text-anchor="start">Public LoadBalancer for the app</text>
<text x="60" y="848" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">Blocked: it needs a 4th public IP and the</text>
<text x="60" y="863" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">regional quota is 3 of 3 - Jenkins IP, NAT IP</text>
<text x="60" y="878" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">and the AKS API server already use them.</text>
<rect x="470" y="790" width="400" height="150" rx="12" fill="#FFF6E5" stroke="#E8A33D" stroke-width="2"/>
<text x="490" y="822" font-family="DejaVu Sans" font-size="13" fill="#B26A00" font-weight="bold" text-anchor="start">ingress-nginx (internal LB)</text>
<text x="490" y="848" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">Installed but its address stays pending:</text>
<text x="490" y="863" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">the AKS identity had no network rights on the</text>
<text x="490" y="878" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">VNet. Redundant now - nginx fronts the app.</text>
<rect x="900" y="790" width="400" height="150" rx="12" fill="#F4F7FB" stroke="#C7D3E0" stroke-width="1.4"/>
<text x="920" y="822" font-family="DejaVu Sans" font-size="13" fill="#1B2733" font-weight="bold" text-anchor="start">AWS equivalent</text>
<text x="920" y="848" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">An ALB/NLB with an Elastic IP in front of the</text>
<text x="920" y="863" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">service, or kubectl port-forward for a quick</text>
<text x="920" y="878" font-family="DejaVu Sans" font-size="11" fill="#5A6B7B" font-weight="normal" text-anchor="start">look. Security Groups play the NSG role.</text></svg>