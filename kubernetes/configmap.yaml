apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolve-config
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve-devops
data:
  # Images pushed by GitHub Actions to the Docker Hub repositories under the
  # mostafaosmanfathi namespace. The deployment images themselves are updated
  # by the image CI, this ConfigMap is the reference used by the pipelines.
  FRONTEND_IMAGE: "mostafaosmanfathi/frontend:latest"
  AUTH_SERVICE_IMAGE: "mostafaosmanfathi/auth-service:latest"
  ROADMAP_SERVICE_IMAGE: "mostafaosmanfathi/roadmap-service:latest"

  # Frontend
  FRONTEND_PORT: "3000"
  AUTH_SERVICE_URL: "http://auth-service.ivolve.svc.cluster.local:5000"
  ROADMAP_SERVICE_URL: "http://roadmap-service.ivolve.svc.cluster.local:8080"

  # Auth service
  AUTH_SERVICE_PORT: "5000"
  DB_HOST: "mysql.ivolve.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "ivolve"

  # Roadmap service
  ROADMAP_SERVICE_PORT: "8080"
  SERVER_PORT: "8080"

  # MySQL
  MYSQL_DATABASE: "ivolve"
  MYSQL_USER: "ibrahim"
  MYSQL_PORT: "3306"
