apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ivolve

# The labels are added to the metadata only. The selector of a StatefulSet is
# immutable, so it must never be changed by the transformer.
labels:
  - pairs:
      app.kubernetes.io/part-of: ivolve-devops
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - storageclass.yaml
  - mysql/service.yaml
  - mysql/statefulset.yaml
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - roadmap-service/deployment.yaml
  - roadmap-service/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/nodeport.yaml
  - frontend/ingress.yaml

# GitOps pinning. The Deployments keep `:latest`, and the image tag is set
# here, so a single file is the source of truth for what is deployed.
# .github/workflows/image-ci.yml rewrites these tags to `sha-<commit>` after it
# has pushed the images; Argo CD sees the new revision and rolls it out.
images:
  - name: mostafaosmanfathi/frontend
    newTag: sha-bbec163c84a39008f07d75540d4bf3beec95dcdf
  - name: mostafaosmanfathi/auth-service
    newTag: sha-bbec163c84a39008f07d75540d4bf3beec95dcdf
  - name: mostafaosmanfathi/roadmap-service
    newTag: sha-bbec163c84a39008f07d75540d4bf3beec95dcdf
