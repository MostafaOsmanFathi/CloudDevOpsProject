apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ivolve

# The labels are added to the metadata only. The selector of a StatefulSet is
# immutable, so it must never be changed by the transformer.
labels:
  - pairs:
      app.kubernetes.io/part-of: ivolve-devops
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - storageclass.yaml
  - mysql/service.yaml
  - mysql/statefulset.yaml
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - roadmap-service/deployment.yaml
  - roadmap-service/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/nodeport.yaml
  - frontend/ingress.yaml
