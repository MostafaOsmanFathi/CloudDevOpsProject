# The values below are plain text on purpose, Kubernetes converts stringData
# into the base64 data field when it stores the Secret. Replace them before
# any real deployment, or generate them with:
#
#   kubectl -n ivolve create secret generic ivolve-secret \
#     --from-literal=MYSQL_PASSWORD='...' \
#     --from-literal=MYSQL_ROOT_PASSWORD='...' \
#     --from-literal=SESSION_SECRET='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: ivolve-secret
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve-devops
type: Opaque
stringData:
  # MySQL credentials, used by the StatefulSet and by the auth service.
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "pass@123"

  # Session signing key of the frontend.
  SESSION_SECRET: "change-me-in-k8s"
