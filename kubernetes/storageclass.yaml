# StorageClass used by the MySQL StatefulSet.
#
# Azure: the Azure Disk CSI driver provisions a managed disk. StandardSSD_LRS is
# the cheapest option that is fast enough for a lab database; use
# PremiumSSD_LRS (the built-in `managed-csi` class) if you need premium disks.
# AKS already ships `managed-csi` and `managed-csi-standard`, this class only
# pins the SKU and the filesystem.
#
# AWS equivalent (the original brief): provisioner ebs.csi.aws.com, type gp3.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ivolve-storage
  labels:
    app.kubernetes.io/part-of: ivolve-devops
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
  fsType: ext4
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
