# StorageClass used by the MySQL StatefulSet. It provisions EBS volumes
# through the AWS EBS CSI driver that is installed on the EKS cluster.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ivolve-storage
  labels:
    app.kubernetes.io/part-of: ivolve-devops
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
  kmsKeyId: ""
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
